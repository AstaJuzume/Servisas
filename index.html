ight:800;white-space:nowrap}.table td{padding:15px 16px;border-top:1px solid #edf0ef;vertical-align:middle}.table tr:hover td{background:#fbfdfc}.name{font-weight:750}.sub{font-size:11px;color:#96a2a7;margin-top:3px}.person{display:flex;align-items:center;gap:10px}.initial{height:32px;width:32px;display:grid;place-items:center;border-radius:50%;background:#ecf0ed;color:#456963;font-size:11px;font-weight:800;flex:none}.badge{font-size:11px;font-weight:750;padding:5px 9px;border-radius:30px;white-space:nowrap;background:#eff2f4;color:#667987}.badge.active{background:#dff4eb;color:#167866}.badge.waiting{background:#fff2de;color:#ae722d}.badge.done{background:#edf1f3;color:#687a82}.badge.paused{background:#fceae7;color:#a8554d}.bar{height:7px;background:#edf1f0;border-radius:10px;overflow:hidden;margin-top:8px}.bar span{height:100%;display:block;background:#159483;border-radius:10px}.workload{padding:0 22px 20px}.worker{padding:15px 0;border-top:1px solid #eef1f0}.worker:first-child{border-top:0}.worker-top{display:flex;justify-content:space-between;align-items:center;font-size:13px}.worker-top b{font-size:13px}.worker-top span{color:var(--muted);font-size:12px}.worker-detail{display:flex;justify-content:space-between;color:#9ba7aa;font-size:11px;margin-top:6px}.split-bottom{margin-top:17px}.activity{padding:0 22px 14px}.event{display:flex;gap:12px;padding:13px 0;border-top:1px solid #f0f2f1}.event:first-child{border:0}.event-dot{width:9px;height:9px;border-radius:50%;background:#2f9b87;margin-top:5px;flex:none;box-shadow:0 0 0 4px #e7f5f0}.event b{font-size:12px}.event p{font-size:12px;color:var(--muted);margin:4px 0 0}.event time{margin-left:auto;color:#a2aeb2;font-size:11px;white-space:nowrap}.notice{font-size:12px;line-height:1.55;color:#6d8188;background:#f6faf9;border:1px solid #e2efeb;border-radius:9px;padding:11px 13px;margin:0 22px 20px}.filters{display:flex;align-items:center;gap:9px;margin-bottom:17px;flex-wrap:wrap}.search{border:1px solid var(--line);border-radius:9px;background:#fff;padding:10px 13px;min-width:250px;outline:none}.search:focus,select:focus,input:focus,textarea:focus{border-color:#2b9b8a;outline:2px solid #d7f1e8}.select{border:1px solid var(--line);border-radius:9px;background:#fff;padding:10px 13px;color:var(--ink)}.taskrow{display:grid;grid-template-columns:1.4fr 1.1fr 1fr 1fr 100px;gap:12px;align-items:center;border-top:1px solid #edf0ef;padding:16px 20px;font-size:13px}.taskrow.head{background:#f9faf9;border:0;color:#8b999f;font-size:10px;letter-spacing:.7px;text-transform:uppercase;font-weight:800}.taskrow>div:last-child{text-align:right}.empty{padding:36px;text-align:center;color:var(--muted)}.employee-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.8fr);gap:18px}.clock-card{padding:24px;background:#163d44;color:white;border-radius:15px;box-shadow:0 8px 22px #163d4418}.clock-card .muted{color:#a8c8c8;font-size:12px}.clock-card h2{font-size:23px;margin:9px 0}.clock{font-size:43px;font-weight:800;letter-spacing:-1px;margin:20px 0 8px;font-variant-numeric:tabular-nums}.clock-card .btn{margin:12px 6px 0 0}.employee-task{padding:19px 22px;border-top:1px solid #ecf0ee}.employee-task:first-child{border:0}.employee-task h3{font-size:15px;margin:8px 0}.employee-task p{font-size:12px;color:var(--muted);margin:0 0 14px}.employee-task .row{display:flex;align-items:center;justify-content:space-between;gap:10px}.panel{padding:22px}.panel h2{font-size:17px;margin:0 0 15px}.kv{display:flex;justify-content:space-between;border-top:1px solid #eef1f0;padding:12px 0;font-size:13px}.kv span{color:var(--muted)}.help{font-size:12px;color:var(--muted);line-height:1.6}.timeline{padding:8px 20px 20px}.timeline-grid{display:grid;grid-template-columns:120px repeat(9,minmax(60px,1fr));font-size:11px;min-width:800px}.timeline-grid>*{border-bottom:1px solid #edf0ef;padding:15px 5px}.timeline-grid .hour{color:#91a0a6;text-align:center}.slot{position:relative;background:linear-gradient(to right,transparent calc(100% - 1px),#eef1f0 calc(100% - 1px))}.slot.fill{background:#d6eee8;color:#106d62;border-radius:6px;font-weight:700;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.slot.fill.alt{background:#e7eef4;color:#557895}.slot.fill.warn{background:#fff0da;color:#a97027}.modal-back{position:fixed;inset:0;background:#10242cb8;display:grid;place-items:center;padding:20px;z-index:10}.modal{background:white;border-radius:16px;padding:26px;width:min(520px,100%);box-shadow:0 24px 80px #0003}.modal h2{margin:0 0 5px;font-size:22px}.modal p{color:var(--muted);font-size:13px;margin:0 0 18px}.field{display:grid;gap:6px;margin-bottom:13px;font-size:12px;font-weight:700;color:#50646e}.field input,.field select,.field textarea{border:1px solid #d9e3e2;border-radius:9px;padding:10px 12px;width:100%;background:#fff;color:var(--ink)}.field textarea{min-height:70px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.toast{position:fixed;bottom:24px;right:24px;background:#183e41;color:white;border-radius:9px;padding:12px 18px;font-size:13px;box-shadow:0 10px 25px #0002;z-index:20}.mobile-nav{display:none}
    @media(max-width:1050px){.metrics{grid-template-columns:repeat(2,1fr)}.two,.employee-layout{grid-template-columns:1fr}.content{padding:28px 24px}.topbar{padding:0 24px}.taskrow{grid-template-columns:1.4fr 1fr 100px}.taskrow>div:nth-child(3),.taskrow>div:nth-child(4){display:none}}
    @media(max-width:680px){.shell{display:block;padding-bottom:70px}.sidebar{display:none}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--navy);z-index:5;justify-content:space-around;padding:8px 4px}.mobile-nav button{background:none;border:0;color:#a7bcc2;font-size:11px;display:grid;gap:2px;place-items:center;min-width:72px}.mobile-nav button.active{color:#fff}.mobile-nav span{font-size:19px}.topbar{height:58px;padding:0 17px}.datepill{display:none}.content{padding:24px 16px 35px}.heading{align-items:start;flex-direction:column;margin-bottom:21px}.heading h1{font-size:26px}.metrics{gap:9px}.metric{padding:14px}.metric .value{font-size:24px}.metric .foot{font-size:10px}.metric .mini{display:none}.actions{width:100%}.actions .btn{flex:1}.employee-task{padding:17px}.taskrow{grid-template-columns:1fr 95px;padding:14px}.taskrow>div:nth-child(2){display:none}.search{min-width:0;flex:1}.table th,.table td{padding:12px 10px}.table th:nth-child(3),.table td:nth-child(3){display:none}.top-left{font-size:11px}}
  .service-switch{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin:-6px 0 16px;font-size:12px;font-weight:750;color:#647985}.service-switch .select{min-width:190px}@media(max-width:680px){.service-switch{justify-content:space-between;margin:0 0 19px}.service-switch .select{min-width:0;max-width:70%}}</style>

<body>
<div class="shell">
  <aside class="sidebar"><div class="brand"><div class="brandmark">⌁</div><div>serviso pulsas<small>DARBŲ VALDYMAS</small></div></div><div><div class="side-label">Darbo erdvė</div><nav class="nav" id="nav"></nav></div><div class="side-bottom"><strong>Autoserviso prototipas</strong>Demonstraciniai duomenys. Pakeitimai šiame įrenginyje išsaugomi naršyklėje.</div></aside>
  <main class="main"><header class="topbar"><div class="top-left">Servisas <span style="color:#a6b3b6">/</span> <b id="crumb">Apžvalga</b></div><div class="top-right"><span class="datepill" id="today"></span><div class="avatar">SP</div></div></header><div class="content" id="app"></div></main>
</div><nav class="mobile-nav" id="mobileNav"></nav><div id="overlay"></div><div id="toastbox"></div>
<script>
const services=[{id:'S1',name:'Vilniaus servisas',city:'Vilnius'},{id:'S2',name:'Kauno servisas',city:'Kaunas'}];
const people=[{id:'M1',name:'Mantas Petrauskas',role:'Mechanikas',capacity:8,service:'S1'},{id:'M2',name:'Tomas Vaitkus',role:'Mechanikas',capacity:8,service:'S1'},{id:'M3',name:'Lukas Žilinskas',role:'Diagnostikas',capacity:8,service:'S1'},{id:'M4',name:'Paulius Jankauskas',role:'Mechanikas',capacity:8,service:'S1'},{id:'M5',name:'Darius Stonis',role:'Mechanikas',capacity:8,service:'S2'},{id:'M6',name:'Ieva Vaitiekūnaitė',role:'Diagnostikė',capacity:8,service:'S2'},{id:'M7',name:'Arūnas Kairys',role:'Mechanikas',capacity:8,service:'S2'}];
const seed=[
 {id:1001,plate:'JKS 482',car:'Toyota Corolla',client:'Rasa Kazlauskienė',work:'Stabdžių kaladėlių keitimas',person:'M1',estimate:120,status:'active',elapsed:0,started:Date.now()-48*60000,priority:'Įprastas'},
 {id:1002,plate:'MNB 217',car:'VW Passat',client:'UAB Transportas',work:'Kompiuterinė diagnostika',person:'M3',estimate:90,status:'active',elapsed:0,started:Date.now()-34*60000,priority:'Skubus'},
 {id:1003,plate:'KLP 906',car:'Škoda Octavia',client:'Jonas Balys',work:'Tepalų ir filtrų keitimas',person:'M2',estimate:75,status:'waiting',elapsed:0,started:null,priority:'Įprastas'},
 {id:1004,plate:'HGT 351',car:'BMW 320d',client:'Eglė Marcinkevičienė',work:'Važiuoklės remontas',person:'M4',estimate:180,status:'active',elapsed:0,started:Date.now()-92*60000,priority:'Įprastas'},
 {id:1005,plate:'BVC 733',car:'Ford Focus',client:'Tadas Kairys',work:'Kondicionieriaus patikra',person:'M2',estimate:60,status:'waiting',elapsed:0,started:null,priority:'Įprastas'},
 {id:1006,plate:'LAK 854',car:'Audi A4',client:'Laura Stankevičienė',work:'Akumuliatoriaus keitimas',person:'M1',estimate:45,status:'done',elapsed:39,started:null,priority:'Įprastas'},
 {id:1007,plate:'KAA 741',car:'Volvo XC60',client:'Gabija Meškauskienė',work:'Techninė priežiūra',person:'M5',estimate:120,status:'active',elapsed:0,started:Date.now()-41*60000,priority:'Įprastas'},
 {id:1008,plate:'JHJ 308',car:'Renault Clio',client:'UAB Laisvė',work:'Variklio diagnostika',person:'M6',estimate:90,status:'waiting',elapsed:0,started:null,priority:'Įprastas'},
 {id:1009,plate:'ZUZ 512',car:'Kia Sportage',client:'Andrius Petraitis',work:'Padangų keitimas',person:'M7',estimate:60,status:'done',elapsed:54,started:null,priority:'Įprastas'}
];
let state;try{state=JSON.parse(localStorage.getItem('serviso-pulsas-v2'))}catch(e){};if(!state||!Array.isArray(state.tasks)){try{state=JSON.parse(localStorage.getItem('serviso-pulsas-v1'))}catch(e){}};if(!state||!Array.isArray(state.tasks))state={tasks:seed,events:[{time:'10:42',text:'Mantas pradėjo darbą',detail:'Toyota Corolla · JKS 482'},{time:'10:26',text:'Lukas pradėjo diagnostiką',detail:'VW Passat · MNB 217'},{time:'09:55',text:'Mantas užbaigė darbą',detail:'Audi A4 · LAK 854'}],employee:'M1'};if(!state.tasks.some(t=>t.id===1007)&&!state.migratedServices){state.tasks.push(...seed.filter(t=>t.id>=1007));state.migratedServices=true}state.tasks.forEach(t=>{if(!t.service)t.service=people.find(p=>p.id===t.person)?.service||'S1'});state.selectedService=state.selectedService||'all';
state.events=(state.events||[]).map(e=>({...e,service:e.service||'S1'}));
let view='dashboard',filter='all',query='';const save=()=>localStorage.setItem('serviso-pulsas-v2',JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const person=id=>people.find(p=>p.id===id)||people[0];const min=t=>Math.max(0,Math.round((t.elapsed||0)+((t.status==='active'&&t.started)?(Date.now()-t.started)/60000:0)));const duration=m=>`${Math.floor(m/60)} val. ${String(m%60).padStart(2,'0')} min.`;const stamp=()=>new Date().toLocaleTimeString('lt-LT',{hour:'2-digit',minute:'2-digit'});const badge=s=>`<span class="badge ${s}">${{active:'Vykdomas',waiting:'Laukia',paused:'Pristabdytas',done:'Baigtas'}[s]}</span>`;
function nav(){let items=[['dashboard','◫','Apžvalga'],['tasks','▤','Darbų sąrašas'],['schedule','▥','Užimtumas'],['employee','◷','Darbuotojo ekranas']];document.getElementById('nav').innerHTML=items.map(([v,i,n])=>`<button class="${view===v?'active':''}" onclick="go('${v}')"><span class="icon">${i}</span>${n}</button>`).join('');document.getElementById('mobileNav').innerHTML=items.map(([v,i,n])=>`<button class="${view===v?'active':''}" onclick="go('${v}')"><span>${i}</span>${v==='employee'?'Mano darbai':n}</button>`).join('');document.getElementById('crumb').textContent=items.find(i=>i[0]===view)[2]}
function heading(title,desc,button=''){return `<div class="heading"><div><div class="eyebrow">${view==='employee'?'MECHANIKO DARBO VIETA':'VADOVO DARBO VIETA'}</div><h1>${title}</h1><p>${desc}</p></div>${button?`<div class="actions">${button}</div>`:''}</div>`}
function metric(label,value,foot,icon){return `<div class="card metric"><span class="mini">${icon}</span><div class="label">${label}</div><div class="value">${value}</div><div class="foot">${foot}</div></div>`}
function serviceName(id){return services.find(s=>s.id===id)?.name||'Servisas'}
function visiblePeople(){return people.filter(p=>state.selectedService==='all'||p.service===state.selectedService)}
function visibleTasks(){return state.tasks.filter(t=>state.selectedService==='all'||t.service===state.selectedService)}
function activeTasks(){return visibleTasks().filter(t=>t.status==='active')}
function utilization(p){let m=state.tasks.filter(t=>t.person===p.id&&t.status!=='waiting').reduce((a,t)=>a+min(t),0);return Math.min(100,Math.round(m/(p.capacity*60)*100))}
function workerRows(){return visiblePeople().map(p=>{let active=state.tasks.find(t=>t.person===p.id&&t.status==='active');let waiting=state.tasks.filter(t=>t.person===p.id&&t.status==='waiting').length;let u=utilization(p);return `<div class="worker"><div class="worker-top"><b>${esc(p.name)}</b><span>${u}% dienos užimtumo</span></div><div class="sub">${esc(serviceName(p.service))}</div><div class="bar"><span style="width:${u}%"></span></div><div class="worker-detail"><span>${active?esc(active.work):'Šiuo metu laisvas'}</span><span>${waiting} laukia</span></div></div>`}).join('')}
function eventRows(){return state.events.slice(0,5).map(e=>`<div class="event"><span class="event-dot"></span><div><b>${esc(e.text)}</b><p>${esc(e.detail)}</p></div><time>${esc(e.time)}</time></div>`).join('')}
function dashboard(){let peopleHere=visiblePeople(),tasks=visibleTasks(),active=activeTasks(),waiting=tasks.filter(t=>t.status==='waiting'),done=tasks.filter(t=>t.status==='done');return heading('Serviso apžvalga','Šiandienos darbai ir komandos užimtumas pagal pasirinktą servisą.',`<button class="btn primary" onclick="openTaskModal()">＋ Naujas darbas</button>`)+`<div class="grid metrics">${metric('Dirba dabar',active.length+' / '+peopleHere.length,'Mechanikai prie darbų','◷')}${metric('Laukia vykdymo',waiting.length,'Priskirti darbai','▤')}${metric('Baigti šiandien',done.length,'Atlikti užsakymai','✓')}${metric('Vidutinis užimtumas',Math.round(peopleHere.reduce((a,p)=>a+utilization(p),0)/(peopleHere.length||1))+'%','Pagal registruotą darbo laiką','▥')}</div><div class="grid two"><section class="card"><div class="section-head"><h2>Kas vyksta dabar</h2><small>${active.length} aktyvūs darbai</small></div><div class="tablewrap"><table class="table"><thead><tr><th>Darbuotojas</th><th>Darbas / automobilis</th><th>Laikas</th><th>Būsena</th></tr></thead><tbody>${active.map(t=>`<tr><td><div class="person"><span class="initial">${person(t.person).name.split(' ').map(x=>x[0]).join('')}</span><span><span class="name">${esc(person(t.person).name)}</span><div class="sub">${esc(serviceName(t.service))}</div></span></div></td><td><div class="name">${esc(t.work)}</div><div class="sub">${esc(t.car)} · ${esc(t.plate)}</div></td><td>${duration(min(t))}</td><td>${badge(t.status)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Šiuo metu aktyvių darbų nėra</td></tr>'}</tbody></table></div></section><section class="card"><div class="section-head"><h2>Komandos užimtumas</h2><small>8 val. diena</small></div><div class="workload">${workerRows()}</div></section></div><div class="grid two split-bottom"><section class="card"><div class="section-head"><h2>Laukiantys darbai</h2><button class="btn small" onclick="go('tasks')">Visi darbai →</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Automobilis</th><th>Darbas</th><th>Priskirta</th></tr></thead><tbody>${waiting.map(t=>`<tr><td><div class="name">${esc(t.car)}</div><div class="sub">${esc(t.plate)} · ${esc(serviceName(t.service))}</div></td><td>${esc(t.work)}</td><td>${esc(person(t.person).name)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Laukiančių darbų nėra</td></tr>'}</tbody></table></div></section><section class="card"><div class="section-head"><h2>Veiklos istorija</h2><small>Šiandien</small></div><div class="activity">${state.events.filter(e=>state.selectedService==='all'||e.service===state.selectedService).slice(0,5).map(e=>`<div class="event"><span class="event-dot"></span><div><b>${esc(e.text)}</b><p>${esc(e.detail)}</p></div><time>${esc(e.time)}</time></div>`).join('')||'<div class="empty">Šio serviso įvykių nėra</div>'}</div></section></div>`}
function taskList(){let found=visibleTasks().filter(t=>(filter==='all'||t.status===filter)&&`${t.car} ${t.plate} ${t.work} ${t.client} ${person(t.person).name}`.toLowerCase().includes(query.toLowerCase()));return heading('Darbų sąrašas','Pasirinkto serviso užsakymai vienoje vietoje.',`<button class="btn primary" onclick="openTaskModal()">＋ Naujas darbas</button>`)+`<div class="filters"><input class="search" placeholder="Ieškoti automobilio, numerio ar darbo…" value="${esc(query)}" oninput="query=this.value;renderTaskRows()"><select class="select" onchange="filter=this.value;renderTaskRows()"><option value="all" ${filter==='all'?'selected':''}>Visos būsenos</option><option value="active" ${filter==='active'?'selected':''}>Vykdomi</option><option value="waiting" ${filter==='waiting'?'selected':''}>Laukia</option><option value="paused" ${filter==='paused'?'selected':''}>Pristabdyti</option><option value="done" ${filter==='done'?'selected':''}>Baigti</option></select></div><div class="card" id="taskRows">${taskRows(found)}</div>`}
function taskRows(tasks){return `<div class="taskrow head"><div>Automobilis / klientas</div><div>Darbas</div><div>Darbuotojas</div><div>Būsena / laikas</div><div>Veiksmas</div></div>${tasks.map(t=>`<div class="taskrow"><div><b>${esc(t.car)} · ${esc(t.plate)}</b><div class="sub">${esc(t.client)} · ${esc(serviceName(t.service))} · #${t.id}</div></div><div>${esc(t.work)}<div class="sub">Planuota ${duration(t.estimate)}</div></div><div>${esc(person(t.person).name)}</div><div>${badge(t.status)}<div class="sub">${duration(min(t))}</div></div><div><button class="btn small" onclick="openDetail(${t.id})">Atidaryti</button></div></div>`).join('')||'<div class="empty">Pagal pasirinktą filtrą darbų nėra.</div>'}`}
function renderTaskRows(){let el=document.getElementById('taskRows');if(el)el.innerHTML=taskRows(visibleTasks().filter(t=>(filter==='all'||t.status===filter)&&`${t.car} ${t.plate} ${t.work} ${t.client} ${person(t.person).name}`.toLowerCase().includes(query.toLowerCase())))}
function schedule(){let ps=visiblePeople(),ts=visibleTasks(),act=activeTasks();return heading('Darbuotojų užimtumas','Pasirinkto serviso komandos krūvis ir registruotas darbų laikas.',`<button class="btn" onclick="go('employee')">Atidaryti mechaniko ekraną →</button>`)+`<div class="grid metrics">${metric('Komanda',ps.length,'Darbuotojai šiandien','♟')}${metric('Aktyvūs',act.length,'Dirba šiuo metu','◷')}${metric('Užregistruota',duration(ts.reduce((a,t)=>a+min(t),0)),'Visų darbų laikas','▥')}${metric('Laisvi',ps.length-new Set(act.map(t=>t.person)).size,'Gali pradėti naują darbą','＋')}</div><div class="grid two"><section class="card"><div class="section-head"><h2>Darbuotojų apkrova</h2><small>Užregistruota / 8 val.</small></div><div class="workload">${workerRows()}</div><p class="notice">Užimtumas skaičiuojamas pagal užregistruotą darbų laiką. Būsimiems darbams planuoti reikėtų papildomai įvesti rezervuotus laikus ir darbuotojų grafikus.</p></section><section class="card"><div class="section-head"><h2>Šiuo metu</h2><small>${stamp()}</small></div><div class="activity">${ps.map(p=>{let t=act.find(x=>x.person===p.id);return `<div class="event"><span class="event-dot" style="background:${t?'#2f9b87':'#b6c7ca'}"></span><div><b>${esc(p.name)}</b><p>${t?`${esc(t.work)} · ${esc(t.plate)} · ${duration(min(t))}`:'Laisvas / laukia kito darbo'}</p></div></div>`}).join('')}</div></section></div>`}
function employee(){let list=visiblePeople();if(!list.some(x=>x.id===state.employee))state.employee=list[0]?.id||people[0].id;let p=person(state.employee),tasks=state.tasks.filter(t=>t.person===p.id),active=tasks.find(t=>t.status==='active');return heading('Mano darbai',`${esc(serviceName(p.service))} · pasirinkite darbuotoją ir žymėkite darbo eigą.`,`<select class="select" aria-label="Darbuotojas" onchange="state.employee=this.value;save();render()">${list.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`)+`<div class="employee-layout"><div><div class="clock-card"><div class="muted">${active?'DABAR VYKDOMAS DARBAS':'ŠIUO METU AKTYVAUS DARBO NĖRA'}</div><h2>${active?esc(active.work):'Pasirinkite darbą iš sąrašo'}</h2><div class="muted">${active?`${esc(active.car)} · ${esc(active.plate)} · #${active.id}`:'Paspauskite „Pradėti darbą“ prie priskirto užsakymo.'}</div><div class="clock" id="liveclock">${active?duration(min(active)):'00:00'}</div><div class="muted">${active?'Laikas skaičiuojamas nuo darbo pradžios':'Laikas bus skaičiuojamas automatiškai'}</div>${active?`<button class="btn" onclick="changeStatus(${active.id},'paused')">Ⅱ Pristabdyti</button><button class="btn primary" onclick="changeStatus(${active.id},'done')">✓ Baigti darbą</button>`:''}</div><section class="card" style="margin-top:17px"><div class="section-head"><h2>Man priskirti darbai</h2><small>${tasks.length} darbai</small></div>${tasks.map(t=>`<div class="employee-task"><div class="row"><span class="sub">#${t.id} · ${esc(t.plate)}</span>${badge(t.status)}</div><h3>${esc(t.work)}</h3><p>${esc(t.car)} · ${esc(t.client)} · planuota ${duration(t.estimate)}</p><div class="row"><span class="sub">Užregistruota: ${duration(min(t))}</span>${t.status==='waiting'||t.status==='paused'?`<button class="btn primary small" onclick="changeStatus(${t.id},'active')">▶ ${t.status==='paused'?'Tęsti':'Pradėti'} darbą</button>`:t.status==='active'?`<button class="btn small" onclick="openDetail(${t.id})">Peržiūrėti</button>`:'<span class="sub">Atlikta</span>'}</div></div>`).join('')||'<div class="empty">Priskirtų darbų nėra</div>'}</section></div><div><section class="card panel"><h2>Mano dienos suvestinė</h2><div class="kv"><span>Servisas</span><b>${esc(serviceName(p.service))}</b></div><div class="kv"><span>Darbuotojas</span><b>${esc(p.name)}</b></div><div class="kv"><span>Vykdoma</span><b>${tasks.filter(t=>t.status==='active').length}</b></div><div class="kv"><span>Laukia</span><b>${tasks.filter(t=>t.status==='waiting'||t.status==='paused').length}</b></div><div class="kv"><span>Atlikta</span><b>${tasks.filter(t=>t.status==='done').length}</b></div><div class="kv"><span>Darbo laikas</span><b>${duration(tasks.reduce((a,t)=>a+min(t),0))}</b></div></section><section class="card panel" style="margin-top:17px"><h2>Kaip žymėti laiką?</h2><p class="help">Pradėjus darbą įsijungia laikmatis. Pristabdyto darbo laikas nebedidėja, o paspaudus „Tęsti“ skaičiuojamas toliau. Užbaigus darbą visas sukauptas laikas matomas vadovo apžvalgoje.</p></section></div></div>`}
function render(){nav();document.getElementById('today').textContent=new Date().toLocaleDateString('lt-LT',{weekday:'long',year:'numeric',month:'long',day:'numeric'});document.getElementById('app').innerHTML=`<div class="service-switch"><label for="serviceSelect">Servisas</label><select id="serviceSelect" class="select" onchange="state.selectedService=this.value;save();render()"><option value="all" ${state.selectedService==='all'?'selected':''}>Visi servisai</option>${services.map(x=>`<option value="${x.id}" ${state.selectedService===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`+{dashboard,tasks:taskList,schedule,employee}[view]()}
function go(v){view=v;render();window.scrollTo({top:0,behavior:'smooth'})}
function toast(s){let e=document.getElementById('toastbox');e.innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>e.innerHTML='',3000)}
function log(t,action){state.events.unshift({time:stamp(),text:`${person(t.person).name} ${action}`,detail:`${t.car} · ${t.plate} · ${serviceName(t.service)}`,service:t.service});state.events=state.events.slice(0,20)}
function changeStatus(id,status){let t=state.tasks.find(x=>x.id===id);if(!t)return;if(status==='active'){let other=state.tasks.find(x=>x.person===t.person&&x.status==='active'&&x.id!==id);if(other){toast(`${person(t.person).name} jau vykdo kitą darbą. Pirmiausia jį pristabdykite.`);return}t.started=Date.now();t.status='active';log(t,'pradėjo darbą')}else{t.elapsed=min(t);t.started=null;t.status=status;log(t,status==='done'?'užbaigė darbą':'pristabdė darbą')}save();closeModal();render();toast(status==='active'?'Darbas pradėtas':status==='done'?'Darbas baigtas':'Darbas pristabdytas')}
function closeModal(){document.getElementById('overlay').innerHTML=''}
function openTaskModal(){let selected=state.selectedService==='all'?services[0].id:state.selectedService;document.getElementById('overlay').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><form class="modal" onsubmit="createTask(event)"><h2>Naujas serviso darbas</h2><p>Pasirinkite servisą ir priskirkite darbą jo mechanikui.</p><label class="field">Servisas<select name="service" id="newService" onchange="updateWorkerOptions()">${services.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label class="field">Automobilis<input name="car" required placeholder="Pvz., Volvo V60"></label><label class="field">Valstybinis numeris<input name="plate" required placeholder="ABC 123"></label><label class="field">Klientas<input name="client" required placeholder="Vardas arba įmonė"></label><label class="field">Darbas<input name="work" required placeholder="Pvz., padangų keitimas"></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label class="field">Darbuotojas<select name="person" id="newPerson"></select></label><label class="field">Planuota, min.<input name="estimate" type="number" min="1" value="60" required></label></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Atšaukti</button><button class="btn primary">Sukurti darbą</button></div></form></div>`;updateWorkerOptions()}
function updateWorkerOptions(){let id=document.getElementById('newService').value;document.getElementById('newPerson').innerHTML=people.filter(p=>p.service===id).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}
function createTask(e){e.preventDefault();let f=new FormData(e.target),service=f.get('service'),worker=person(f.get('person'));if(worker.service!==service){toast('Darbuotojas nepriklauso pasirinktam servisui');return}let t={id:Math.max(...state.tasks.map(t=>t.id),1000)+1,car:f.get('car').trim(),plate:f.get('plate').trim().toUpperCase(),client:f.get('client').trim(),work:f.get('work').trim(),person:worker.id,service,estimate:Number(f.get('estimate')),elapsed:0,started:null,status:'waiting',priority:'Įprastas'};state.tasks.unshift(t);state.events.unshift({time:stamp(),text:'Sukurtas naujas darbas',detail:`${t.car} · ${t.plate} · ${serviceName(service)}`,service});save();closeModal();render();toast('Darbas sukurtas ir priskirtas')}
function openDetail(id){let t=state.tasks.find(x=>x.id===id);document.getElementById('overlay').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${esc(t.car)} · ${esc(t.plate)}</h2><p>Užsakymas #${t.id} · ${esc(t.client)}</p><div class="kv"><span>Darbas</span><b>${esc(t.work)}</b></div><div class="kv"><span>Servisas</span><b>${esc(serviceName(t.service))}</b></div><div class="kv"><span>Darbuotojas</span><b>${esc(person(t.person).name)}</b></div><div class="kv"><span>Būsena</span>${badge(t.status)}</div><div class="kv"><span>Planuota</span><b>${duration(t.estimate)}</b></div><div class="kv"><span>Užregistruota</span><b>${duration(min(t))}</b></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Uždaryti</button>${t.status==='active'?`<button class="btn" onclick="changeStatus(${id},'paused')">Pristabdyti</button><button class="btn primary" onclick="changeStatus(${id},'done')">Baigti</button>`:t.status==='waiting'||t.status==='paused'?`<button class="btn primary" onclick="changeStatus(${id},'active')">${t.status==='paused'?'Tęsti':'Pradėti'} darbą</button>`:''}</div></div></div>`}
setInterval(()=>{if(view==='employee'){let t=state.tasks.find(t=>t.person===state.employee&&t.status==='active');let el=document.getElementById('liveclock');if(el&&t)el.textContent=duration(min(t))}if(view==='dashboard'||view==='schedule')render()},15000);render();
</script>
</body>
</html>
